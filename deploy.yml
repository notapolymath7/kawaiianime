name: Deploy Kawaiianime+ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5        # ✅ Node.js 24 native

      - name: Prepare site files
        run: |
          if [ -f "Kawaiianime-Plus-NO-ADMIN.html" ]; then
            cp Kawaiianime-Plus-NO-ADMIN.html index.html
            echo "✅ Renamed to index.html"
          fi
          echo "📁 Files to deploy:"
          ls -lh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
